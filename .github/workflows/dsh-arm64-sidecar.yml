# Fork-only arm64 build using the regular build-apk.yml job.
name: DSH arm64 APK sidecar

on:
  push:
    branches: [codex/dsh-arm64-sidecar-20261123]

concurrency:
  group: dsh-arm64-sidecar-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.repository == 'cnxysoft/dsh-mobile-apk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        abi: [arm64]
    env:
      # build-apk.mjs 依赖本仓库顶层 scripts/plugins/vendor/base；apk 仓库 = $GITHUB_WORKSPACE
      DSH_APK_DIR: ${{ github.workspace }}
    steps:
      # 每个 ABI job 只需要本 ABI 的 base-usr 与共用 base-dsh；先缓存，未命中才按路径拉取。
      # checkout 的 lfs:true 是按 ref fetch，不能从 fetch-depth:0 推断它会下载历史全部 LFS。
      - name: 检出本仓库（不含 LFS 归档；底座下方按需拉取）
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false
      - name: 缓存底座归档（命中则跳过 LFS 拉取）
        id: lfs-base
        uses: actions/cache@v4
        with:
          path: base
          key: lfsbase-${{ matrix.abi }}-${{ hashFiles(format('base/base-dsh.tar.xz'), format('base/base-usr-{0}.tar.xz', matrix.abi)) }}
      - name: 按需拉取 LFS 底座（仅本 ABI，未命中缓存时）
        if: steps.lfs-base.outputs.cache-hit != 'true'
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="base/base-usr-${ABI}.tar.xz,base/base-dsh.tar.xz"
      - name: 断言底座确实已落地（拒绝 LFS pointer 冒充文件）
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          node scripts/require-lfs-materialized.mjs \
            "base/base-usr-${ABI}.tar.xz" "base/base-dsh.tar.xz"

      - name: 准备运行时（node；dsh-client-ui-responsive 的 tsdown 要求 node ^22.18 || >=24.11）
        uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: python -> python3（脚本用 `python`）
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3 python-is-python3 || sudo ln -sf /usr/bin/python3 /usr/bin/python
          python --version
      - name: 检出合同钉定的上游源码供打包门禁核对
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM=$(node -p 'require("./scripts/contract.json").upstreamRepo')
          COMMIT=$(node -p 'require("./scripts/contract.json").upstream.commit')
          TAG=$(node -p 'require("./scripts/contract.json").upstream.tag')
          test -n "$COMMIT" && test -n "$TAG"
          git clone --filter=blob:none --single-branch --branch "$TAG" --depth=1 \
            https://github.com/deepseek-ai/deepseek-harness.git "$UPSTREAM"
          test "$(git -C "$UPSTREAM" rev-parse HEAD)" = "$COMMIT"
          node scripts/check-dead-tokens.mjs --require
      - name: 准备 Java（gradle 需要）
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Install the pinned arm64 Rust and Android NDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          read -r rust_version ndk_version rust_target < <(node -e '
            const config = require("./native/phone-control-core/build-config.json");
            console.log(config.compiler.rustc, config.ndk.version, config.abis["arm64-v8a"].rustTarget);
          ')
          ndk="$ANDROID_HOME/ndk/$ndk_version"
          readelf="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          if [[ ! -x "$readelf" ]]; then
            sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk_version"
          fi
          test -x "$readelf"
          test "$(sed -n 's/^Pkg\.Revision[[:space:]]*=[[:space:]]*//p' "$ndk/source.properties")" = "$ndk_version"
          printf 'ANDROID_NDK_HOME=%s\n' "$ndk" >> "$GITHUB_ENV"
          rustup toolchain install "$rust_version" --profile minimal --target "$rust_target"
          rustup run "$rust_version" rustc --version

      - name: 生成本次构建的 Kotlin 单测结果
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: 准备并构建插件（统一清单、锁解析与单次构建）
        shell: bash
        run: |
          set -euo pipefail
          # 清单保证 termux 先于 linux-env；host-web-compat 使用登记的发布产物。
          mapfile -t plugin_dirs < <(node -e "const fs=require('node:fs'); const {dirs}=require('./scripts/plugin-dirs.json'); console.log(dirs.filter(d=>JSON.parse(fs.readFileSync(d+'/package.json','utf8')).scripts?.build).join('\n'))")
          test "${#plugin_dirs[@]}" -gt 0
          for d in "${plugin_dirs[@]}"; do
            node scripts/source-build/install-project-dependencies.mjs "$d" .deploy-tmp/source-build/plugin-lock-resolution-build.json
            (cd "$d" && npm run build)
          done

      - name: stage 底座归档（base/ -> .deploy-tmp/<base-dir>/）
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          abi="$ABI"
          # build-snapshot-013.mjs 的 BASE_DIR：arm64 -> arm64-base；x86_64 -> x64-base（缩写，勿写 x86_64-base）
          if [ "$abi" = "arm64" ]; then bdir="arm64-base"; else bdir="x64-base"; fi
          mkdir -p ".deploy-tmp/${bdir}"
          [ -f "base/base-usr-${abi}.tar.xz" ] || { echo "缺 base/base-usr-${abi}.tar.xz"; exit 1; }
          cp "base/base-usr-${abi}.tar.xz" ".deploy-tmp/${bdir}/base-usr.tar.xz"
          [ -f "base/base-dsh.tar.xz" ] && cp "base/base-dsh.tar.xz" ".deploy-tmp/${bdir}/base-dsh.tar.xz"
          du -sh ".deploy-tmp/${bdir}"

      - name: 构建快照 ${abi}（build-snapshot，Termux 源装配 + 注入 + 门禁 + 归档）
        shell: bash
        # issue #1614：同一条纪律——值一律走 env，run 里只引用变量。
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          node scripts/build-snapshot-013.mjs "$ABI"

      - name: 构建 APK ${abi}（注入插件 + 门禁 + gradle + 产物）
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
          SUFFIX: ""
        run: |
          set -euo pipefail
          node scripts/build-apk.mjs --abi "$ABI" --suffix "$SUFFIX"

      - name: 上传前复核最终 APK 签名
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-apk-signatures.mjs --self-test
          mapfile -t apks < <(find out -type f -name '*.apk' | sort)
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::当前 ABI 产物数不是 1: ${#apks[@]}"; exit 1; }
          # keystore 凭据必须显式声明（issue #1031）：门禁不再回落到 androiddebugkey/android。
          # 这里是仓库那份 keystore/debug.keystore 的公开凭据，与 app/build.gradle.kts 的 repoDebug 同源。
          node scripts/check-apk-signatures.mjs --apk "${apks[0]}" --keystore keystore/debug.keystore \
            --keystore-alias androiddebugkey --keystore-pass android

      - name: 上传 APK 产物（本地下载 debug；不出 Release）
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-apk-${{ matrix.abi }}
          # 版本目录来自 app/build.gradle.kts（ST-06）：写死 out/v0.13.0 会在版本 bump 后静默
          # 落到 if-no-files-found: error（云端链「构建成功但无产物」）。
          path: out/v*/*.apk
          if-no-files-found: error
          retention-days: 30
